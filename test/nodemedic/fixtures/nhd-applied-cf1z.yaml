# Canned NHD CR for the Day-1-AM stub deliverable on **cf1z** (the
# Azure kubeadm test cluster). Sister fixture to nhd-applied.yaml,
# which is AWS/EKS-shaped.
#
# WARNING — applying this fixture will cause the controller to
# **cordon node cf1z-general-nodes-1000001**. No new pods will land
# on that node until you uncordon:
#
#   kubectl --context=cf1z uncordon cf1z-general-nodes-1000001
#
# Existing pods on the node keep running; only scheduling is paused.
#
# Usage:
#   kubectl --context=cf1z -n cf-monitoring apply \
#     -f test/nodemedic/fixtures/nhd-applied-cf1z.yaml
#
# Field values captured from a live cf1z worker:
#   spec.providerID = azure:///subscriptions/2f7759ef-.../resourceGroups/
#       test-angry-bench/providers/Microsoft.Compute/virtualMachineScaleSets/
#       cf1z-general-nodes-1/virtualMachines/1
#   topology.kubernetes.io/region = eastus
#
# providerid.ParseAzure extracts the trailing /virtualMachines/<id>
# segment, which on a VMSS is the per-instance id ("1") rather than
# the VM resource name. That's intentional and matches what
# cloud-provider-azure exposes.
apiVersion: nodemedic.cf.newrelic.com/v1alpha1
kind: NodeHealthDiagnosisAI
metadata:
  name: cf1z-general-nodes-1000001-applied-fixture
  namespace: cf-monitoring
spec:
  case:
    caseId: 8f3c1e2a-9b4d-4f7a-9c1e-2a9b4d4f7a9c
    nodeName: cf1z-general-nodes-1000001
    clusterName: cf1z
    provider: azure
    region: eastus
    instanceId: "1"
    trigger:
      type: ConntrackSaturated
      reason: ConntrackHigh
      message: "nf_conntrack_count=262100 max=262144"
      observedAt: "2026-06-12T15:00:00Z"
  budgets:
    maxTurns: 15
    maxBudgetUSD: "0.50"
    deadline: "2026-06-12T15:01:00Z"
status:
  phase: Diagnosed
  conditions:
    - type: AgentInvoked
      status: "True"
      reason: Posted
      message: agent stub fixture; controller did not actually POST /diagnose
      lastTransitionTime: "2026-06-12T15:00:05Z"
    - type: ReportReady
      status: "True"
      reason: DiagnosisWritten
      message: hand-canned diagnosis for Day-1-AM stub deliverable on cf1z
      lastTransitionTime: "2026-06-12T15:00:35Z"
  diagnosis:
    rootCause: |
      conntrack table exhausted on the node — kube-proxy iptables rules and
      pod-to-service NAT all funnel through nf_conntrack which is sized for
      the default 262144 entries. Three independent signals concur: NRQL
      shows linear growth of conntrack_count over the last hour, ssh sysctl
      confirms current usage at 99.9% of max, and kubectl shows the
      kube-proxy pod logging "conntrack table full" warnings.
    rcaCategory: Conntrack
    confidence: 0.85
    evidence:
      - source: nrql
        ref: "FROM SystemSample SELECT max(conntrack_count) WHERE hostname = 'cf1z-general-nodes-1000001' SINCE 1 hour ago TIMESERIES"
        result: "linear growth from 180000 to 262100 over 60min"
        observedAt: "2026-06-12T15:00:20Z"
      - source: ssh
        ref: "sysctl net.netfilter.nf_conntrack_count net.netfilter.nf_conntrack_max"
        result: "net.netfilter.nf_conntrack_count = 262100\nnet.netfilter.nf_conntrack_max = 262144"
        observedAt: "2026-06-12T15:00:25Z"
      - source: kubectl
        ref: "kubectl logs -n kube-system kube-proxy-xxx --tail=50"
        result: "nf_conntrack: table full, dropping packet (x47 in last 30s)"
        observedAt: "2026-06-12T15:00:30Z"
    recommendation:
      action: Cordon
      reason: prevent new pods from landing while the table is saturated
    auditLogRef:
      objectStore: "s3://nodemedic-audit/dev/8f3c1e2a-9b4d-4f7a-9c1e-2a9b4d4f7a9c.jsonl"
    modelUsed: claude-opus-4-7
    turnsUsed: 7
    costUSD: "0.18"
    completedAt: "2026-06-12T15:00:35Z"
