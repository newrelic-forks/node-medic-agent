# Azure Service Principal credentials for the NodeMedic agent.
# Required ONLY on Azure-cluster installs (where the agent invokes `az` against
# the kubeadm cluster's Azure resources). NOT required on AWS-cluster installs.
#
# Per §10.3 of the spec, the hackathon path uses SP client-secret rather than
# workload identity. Workload identity is the production-restoration path.
#
# Required role on the SP: **Reader** on the cluster's resource group. Nothing wider.
# Verify before applying:
#   az role assignment list --assignee <client-id> --scope /subscriptions/<sub>/resourceGroups/<rg>
#
# To populate:
#   1. Create or pick an existing SP scoped Reader on the cluster's resource group:
#        az ad sp create-for-rbac --name nodemedic-hackathon \
#            --role Reader --scopes /subscriptions/<sub>/resourceGroups/<rg>
#   2. Paste the appId / password / tenant from the output below.
#   3. Verify the SP cannot mutate (chart review per FR-13's deferral note):
#        az vm delete --ids <some-vm-id> --no-wait
#        # expected: AuthorizationFailed

apiVersion: v1
kind: Secret
metadata:
  name: nodemedic-azure-creds
  namespace: container-fabric
  labels:
    app.kubernetes.io/name: nodemedic-agent
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # Mounted into the agent pod as env vars: AZURE_TENANT_ID, AZURE_CLIENT_ID,
  # AZURE_CLIENT_SECRET. The `az` CLI picks these up automatically via the
  # service-principal env var convention.
  AZURE_TENANT_ID: "<REPLACE_WITH_TENANT_ID>"
  AZURE_CLIENT_ID: "<REPLACE_WITH_SP_APP_ID>"
  AZURE_CLIENT_SECRET: "<REPLACE_WITH_SP_PASSWORD>"

  # Subscription + resource group the agent should default to. The agent's
  # runbook prompt will reference these when constructing `az` invocations.
  AZURE_SUBSCRIPTION_ID: "<REPLACE_WITH_SUBSCRIPTION_ID>"
  AZURE_RESOURCE_GROUP: "<REPLACE_WITH_CLUSTER_RG>"
