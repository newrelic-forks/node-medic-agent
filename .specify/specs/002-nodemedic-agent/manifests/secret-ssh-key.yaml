# Hackathon-scoped SSH private key for the NodeMedic agent.
# Used by the agent's Bash `ssh -i $SSH_KEY_PATH` invocations to reach worker nodes (FR-16).
# The matching public half MUST be provisioned on target node AMIs / cloud-init out-of-band
# before Day 1 — this Secret only carries the private half.
#
# To populate:
#   1. Generate a fresh keypair scoped to the hackathon:
#        ssh-keygen -t ed25519 -N "" -C "nodemedic-hackathon-2026" -f /tmp/nodemedic-id_ed25519
#   2. base64-encode the private key:
#        base64 -i /tmp/nodemedic-id_ed25519 | tr -d '\n'
#   3. Paste the result into `data.id_ed25519` below (use stringData if you'd rather paste raw).
#   4. Push the .pub half onto target node AMIs (Track 1 of `nodemedic-scope.md` §4).
#   5. Delete /tmp/nodemedic-id_ed25519 from the bastion host after applying.
#
# Rotation: regenerate, re-apply, push new public half to AMIs, kubectl rollout restart.

apiVersion: v1
kind: Secret
metadata:
  name: nodemedic-ssh-key
  namespace: container-fabric
  labels:
    app.kubernetes.io/name: nodemedic-agent
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # OpenSSH-format ed25519 private key. The agent's Deployment mounts this at
  # /etc/nodemedic/ssh/id_ed25519 with mode 0600. Path is exposed as $SSH_KEY_PATH.
  id_ed25519: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    <REPLACE_WITH_HACKATHON_PRIVATE_KEY_PEM>
    -----END OPENSSH PRIVATE KEY-----

  # Optional: pre-populated known_hosts for the cluster's worker nodes. If absent,
  # the agent runs with `-o StrictHostKeyChecking=no` per FR-16.
  known_hosts: ""
