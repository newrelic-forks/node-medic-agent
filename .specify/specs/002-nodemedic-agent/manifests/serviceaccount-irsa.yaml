# NodeMedic agent ServiceAccount with IRSA annotation.
# Required on AWS-cluster installs ONLY — this is how the agent pod gets AWS
# credentials for `aws` CLI calls (DescribeInstanceStatus, DescribeEvents, etc.).
#
# Authentication to Claude does NOT go through this ServiceAccount — the agent
# uses the nerd-completion gateway via ANTHROPIC_AUTH_TOKEN (see
# secret-anthropic-token.yaml), not Bedrock or the public Anthropic API.
#
# Prerequisites (do these BEFORE applying this manifest):
#   1. Create an IAM role in the AWS account that owns the cluster, with:
#      - Trust policy: assumable by the cluster's OIDC provider for
#        ServiceAccount system:serviceaccount:container-fabric:nodemedic-agent
#      - Inline policy: read-only AWS investigation surface ONLY:
#        - ec2:DescribeInstanceStatus, ec2:DescribeInstances
#        - health:DescribeEvents
#      - Explicitly NOT granted: any *:* mutate verb on EC2/IAM/anything else,
#        and NOT bedrock:* (we don't use Bedrock).
#        Verify per FR-13's "captain chart-review" guidance:
#          aws ec2 terminate-instances --dry-run --instance-ids i-...
#          # expected: UnauthorizedOperation
#   2. Capture the role ARN.
#   3. Replace <REPLACE_WITH_IAM_ROLE_ARN> below.
#
# Reference: https://docs.aws.amazon.com/eks/latest/userguide/iam-roles-for-service-accounts.html

apiVersion: v1
kind: ServiceAccount
metadata:
  name: nodemedic-agent
  namespace: container-fabric
  labels:
    app.kubernetes.io/name: nodemedic-agent
    app.kubernetes.io/component: identity
  annotations:
    # IRSA binding for AWS investigation tooling only (`aws ec2 …`, etc.).
    # Pod's AWS SDK / CLI calls sign with this role's credentials.
    eks.amazonaws.com/role-arn: "<REPLACE_WITH_IAM_ROLE_ARN>"
