# New Relic MCP token for the NodeMedic agent.
# Used to authenticate against the public NR HTTP MCP server (FR-4 §2).
# Replace the placeholder with the team's NR token scoped to account 1 (staging).
#
# Reference: https://docs.newrelic.com/docs/agentic-ai/mcp/

apiVersion: v1
kind: Secret
metadata:
  name: nodemedic-nr-token
  namespace: cf-monitoring
  labels:
    app.kubernetes.io/name: nodemedic-agent
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # NR API key with NRQL query permission on staging account 1.
  # Generated at https://one.newrelic.com → API keys.
  token: "<REPLACE_WITH_NR_API_KEY>"

  # NR MCP base URL. Fixed for the public service unless overridden.
  url: "https://mcp.newrelic.com"
