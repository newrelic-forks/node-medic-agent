# nerd-completion gateway token for the NodeMedic agent.
# This is how the agent reaches Claude — through New Relic's internal
# nerd-completion proxy, NOT the public Anthropic API and NOT AWS Bedrock.
# Same pattern as source.datanerd.us/nova/k8s-agent-claude-sdk.
#
# Retrieve from Vault using:
#   newrelic-vault us read -field=value containers/teams/nova/staging/nova-service/NERD_COMPLETION_API_TOKEN
#
# We are reusing Nova's nova-service Vault path for the hackathon (same path
# nova/k8s-agent-claude-sdk uses). Container Fabric will register its own
# nerd-completion service path post-hackathon as part of production rollout.
#
# The Claude Agent SDK reads two env vars to talk to Claude:
#   ANTHROPIC_AUTH_TOKEN  — bearer token (this Secret)
#   ANTHROPIC_BASE_URL    — gateway URL (set in the Deployment, not here)
#
# No code changes vs. the public Anthropic API path — the SDK's HTTP client
# already respects ANTHROPIC_BASE_URL.

apiVersion: v1
kind: Secret
metadata:
  name: nodemedic-anthropic-token
  namespace: container-fabric
  labels:
    app.kubernetes.io/name: nodemedic-agent
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  # Mounted into the agent pod as ANTHROPIC_AUTH_TOKEN env var.
  token: "<REPLACE_WITH_NERD_COMPLETION_TOKEN>"
