apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-medic-agent
  namespace: cf-monitoring
  labels:
    app.kubernetes.io/name: node-medic-agent
    app.kubernetes.io/managed-by: hackathon-2026
---
# Bind to the cluster-built-in `system:node-problem-detector` ClusterRole
# (verified present on cf1z). That role grants the standard NPD permissions:
# get/list/watch nodes, patch nodes/status (NodeConditions), create/patch events.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-medic-agent
  labels:
    app.kubernetes.io/name: node-medic-agent
    app.kubernetes.io/managed-by: hackathon-2026
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:node-problem-detector
subjects:
  - kind: ServiceAccount
    name: node-medic-agent
    namespace: cf-monitoring
