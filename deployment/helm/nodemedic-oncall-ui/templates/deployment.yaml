{{- $_ := include "nodemedic-oncall-ui.requireTestCluster" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nodemedic-oncall-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nodemedic-oncall-ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "nodemedic-oncall-ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "nodemedic-oncall-ui.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "nodemedic-oncall-ui.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oncall-ui
          image: {{ include "nodemedic-oncall-ui.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--cluster-name={{ .Values.clusterName }}"
            - "--namespace={{ .Values.config.namespace }}"
            - "--ui-base-url={{ .Values.config.uiBaseURL }}"
            - "--listen-addr=:{{ .Values.service.port }}"
            - "--drain-concurrency={{ .Values.config.drainConcurrency }}"
            - "--audit-buffer-size={{ .Values.config.auditBufferSize }}"
            - "--log-level={{ .Values.config.logLevel }}"
          env:
            # Mirror flag values into env vars so an operator running
            # `kubectl exec`-style debugging (or a future env-only
            # caller) sees the same configuration the binary parsed.
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: NAMESPACE
              value: {{ .Values.config.namespace | quote }}
            - name: UI_BASE_URL
              value: {{ .Values.config.uiBaseURL | quote }}
            - name: LISTEN_ADDR
              value: ":{{ .Values.service.port }}"
            - name: DRAIN_CONCURRENCY
              value: {{ .Values.config.drainConcurrency | quote }}
            - name: AUDIT_BUFFER_SIZE
              value: {{ .Values.config.auditBufferSize | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
