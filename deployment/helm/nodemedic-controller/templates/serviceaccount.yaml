{{- $_ := include "nodemedic.requireTestCluster" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nodemedic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nodemedic.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
{{- toYaml . | nindent 2 }}
{{- end }}
