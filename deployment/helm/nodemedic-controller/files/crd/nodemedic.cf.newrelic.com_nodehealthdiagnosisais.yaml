---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: nodehealthdiagnosisais.nodemedic.cf.newrelic.com
spec:
  group: nodemedic.cf.newrelic.com
  names:
    kind: NodeHealthDiagnosisAI
    listKind: NodeHealthDiagnosisAIList
    plural: nodehealthdiagnosisais
    shortNames:
    - nhd
    singular: nodehealthdiagnosisai
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.case.nodeName
      name: Node
      type: string
    - jsonPath: .spec.case.provider
      name: Provider
      type: string
    - jsonPath: .status.diagnosis.confidence
      name: Confidence
      type: number
    - jsonPath: .status.action.decision
      name: Decision
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NodeHealthDiagnosisAI is one diagnosis case for one (Node, NodeCondition)
          pair.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              NodeHealthDiagnosisAISpec is the user-set input for a diagnosis case.
              Written by the controller (Scope 2); read by the agent (Scope 3).
            properties:
              budgets:
                description: |-
                  BudgetsSpec bounds the agent's loop. The controller writes these on
                  Create; the agent enforces maxTurns and maxBudgetUSD; both sides
                  honor the deadline (Constitution Article I.8).
                properties:
                  deadline:
                    description: Deadline is the hard wall-clock cap (RFC3339).
                    format: date-time
                    type: string
                  maxBudgetUSD:
                    default: "0.50"
                    description: |-
                      MaxBudgetUSD is the per-case dollar cap, encoded as decimal-as-string
                      to avoid floating-point drift.
                    pattern: ^[0-9]+\.[0-9]{2}$
                    type: string
                  maxTurns:
                    default: 15
                    description: MaxTurns is the per-case turn cap.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              case:
                description: |-
                  CaseSpec carries everything the agent needs to start a diagnosis.
                  All fields are required unless explicitly marked optional.
                properties:
                  caseId:
                    description: CaseId is a UUIDv4 generated by the controller and
                      echoed by the agent.
                    pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
                    type: string
                  clusterName:
                    description: ClusterName is set per Helm install via the --cluster-name
                      flag.
                    minLength: 1
                    type: string
                  instanceId:
                    description: InstanceId is the AWS instance-id or Azure VM name.
                    minLength: 1
                    type: string
                  nodeName:
                    description: NodeName is the apiserver Node name.
                    maxLength: 253
                    type: string
                  provider:
                    description: Provider names the cloud the Node runs on.
                    enum:
                    - aws
                    - azure
                    type: string
                  region:
                    description: Region is the cloud region (e.g. us-east-2, eastus2).
                    minLength: 1
                    type: string
                  trigger:
                    description: Trigger is the NodeCondition payload that woke the
                      controller.
                    properties:
                      message:
                        description: Message is the NPD rule message, truncated to
                          256 bytes.
                        maxLength: 256
                        type: string
                      observedAt:
                        description: ObservedAt is when NPD flipped the Condition
                          to True.
                        format: date-time
                        type: string
                      reason:
                        description: Reason is the NPD rule reason. May be empty.
                        type: string
                      type:
                        description: Type is the NodeCondition.type, e.g. ConntrackSaturated.
                        minLength: 1
                        type: string
                    required:
                    - observedAt
                    - type
                    type: object
                required:
                - caseId
                - clusterName
                - instanceId
                - nodeName
                - provider
                - region
                - trigger
                type: object
            required:
            - budgets
            - case
            type: object
          status:
            description: NodeHealthDiagnosisAIStatus is the observed state of a case.
            properties:
              action:
                description: Action is the controller's record of what it did.
                properties:
                  appliedAt:
                    format: date-time
                    type: string
                  decision:
                    description: ActionDecision is the controller's decision after
                      the gate runs.
                    enum:
                    - Applied
                    - Skipped
                    - HumanInLoop
                    type: string
                  notifications:
                    description: |-
                      Notifications collects the side-channel notifications the controller
                      fired for this case. Slack is the only notifier in v1; PagerDuty is
                      reserved for post-hackathon.
                    properties:
                      slack:
                        description: SlackNotification records a successful Slack
                          post for audit purposes.
                        properties:
                          channel:
                            type: string
                          permalink:
                            type: string
                          ts:
                            type: string
                        type: object
                    type: object
                  operation:
                    description: ActionOperation is the kube-side mutation actually
                      performed.
                    enum:
                    - cordon
                    - noop
                    type: string
                type: object
              conditions:
                description: |-
                  Conditions is the standard k8s Condition history. Every phase
                  transition adds or updates an entry (NFR-7 audit trail).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              diagnosis:
                description: Diagnosis is written once by the agent.
                properties:
                  auditLogRef:
                    description: AuditLogRef points at the PreToolUse audit JSONL.
                    properties:
                      objectStore:
                        description: ObjectStore is e.g. s3://... or a local path.
                        type: string
                    type: object
                  completedAt:
                    description: CompletedAt is when the agent finished writing the
                      diagnosis.
                    format: date-time
                    type: string
                  confidence:
                    description: Confidence is in [0.0, 1.0].
                    maximum: 1
                    minimum: 0
                    type: number
                  costUSD:
                    description: CostUSD is the agent-loop dollar cost, decimal-as-string.
                    type: string
                  evidence:
                    description: |-
                      Evidence is the supporting citations. Min 2 distinct sources for
                      the gate to pass.
                    items:
                      description: |-
                        EvidenceItem is one citation backing the agent's diagnosis. The
                        confidence gate (FR-6) requires at least two distinct sources for
                        auto-cordon to fire.
                      properties:
                        observedAt:
                          description: ObservedAt is when the evidence was captured.
                          format: date-time
                          type: string
                        ref:
                          description: Ref is the query / command / path that produced
                            the evidence.
                          type: string
                        result:
                          description: Result is the raw result, truncated to 4 KB.
                          maxLength: 4096
                          type: string
                        source:
                          description: Source is the evidence-source taxonomy entry.
                          enum:
                          - nrql
                          - ssh
                          - kubectl
                          - cloud
                          - proc
                          - log
                          type: string
                      required:
                      - source
                      type: object
                    type: array
                  modelUsed:
                    description: ModelUsed names the LLM that produced the diagnosis.
                    type: string
                  rcaCategory:
                    description: RCACategory classifies the failure family.
                    enum:
                    - Conntrack
                    - FD
                    - PID
                    - Inode
                    - Disk
                    - DNS
                    - IMDS
                    - Kernel
                    - Kubelet
                    - Unknown
                    type: string
                  recommendation:
                    description: Recommendation is the agent's recommended response.
                    properties:
                      action:
                        description: |-
                          RecommendationAction is the agent's recommended response. The controller
                          only ever performs Cordon (Constitution Article I.2). DrainAndCordon is
                          honored as Cordon; NoAction skips cordon entirely and routes to
                          HumanInLoop framing.
                        enum:
                        - Cordon
                        - DrainAndCordon
                        - NoAction
                        type: string
                      reason:
                        description: Reason is a short human-readable justification.
                        type: string
                    required:
                    - action
                    type: object
                  rootCause:
                    description: RootCause is a one-paragraph RCA.
                    type: string
                  turnsUsed:
                    description: TurnsUsed is the count of agent loop turns consumed.
                    format: int32
                    type: integer
                type: object
              evaluation:
                description: Evaluation is reserved for post-hackathon. Not written
                  or read in v1.
                properties:
                  agreesWithDiagnosis:
                    type: boolean
                  completedAt:
                    format: date-time
                    type: string
                  confidence:
                    type: number
                  notes:
                    type: string
                type: object
              phase:
                description: Phase is the controller-driven phase machine state. See
                  spec FR-5.
                enum:
                - Pending
                - Diagnosing
                - Diagnosed
                - Evaluating
                - Evaluated
                - Acted
                - Failed
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
