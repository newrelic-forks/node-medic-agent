# Azure overrides for the NodeMedic controller chart.
#
# `cf1z` is the legacy Container Fabric Azure kubeadm test cluster
# (sister to jc1z / sk1z). Per Constitution Article I.9 it's the only
# Azure-side name accepted by the chart's cluster-name guard alongside
# `test-*` AWS/EKS clusters.
#
# Apply with:
#   helm --kube-context=cf1z upgrade --install nodemedic-controller \
#     ./deployment/helm/nodemedic-controller \
#     -n cf-monitoring \
#     -f deployment/helm/nodemedic-controller/values-azure.yaml \
#     --set clusterName=cf1z
#
# `clusterName` is deliberately not defaulted — set it explicitly per
# install so an accidental file-only override can't bypass the per-
# cluster guard.

config:
  agentURL: "http://nodemedic-agent.cf-monitoring.svc:8080/diagnose"
  # DEMO: Scope 3's agent isn't deployed on cf1z yet — bypass it so
  # the controller can drive its phase machine without DNS-failing on
  # nodemedic-agent.cf-monitoring.svc. Flip back to false the moment
  # the agent service exists in this namespace.
  stubAgent: true

  # Spec 003 on-call UI integration on cf1z. Until T029 ships, these
  # env vars are present but unread by the controller binary.
  # `useBlockKit: true` becomes the live behavior the moment T029
  # lands; flipping to false is the demo-day rollback to the existing
  # plain-text Slack format.
  useBlockKit: true
  uiBaseURL: "http://localhost:8080"
  # Display string only — webhook routing lives in the
  # `nodemedicSlack` Secret. Override at install time with
  # `--set config.slackChannel='#cf-oncall-alerts'` to surface the
  # channel that the cf1z webhook actually posts to.
  slackChannel: "#cf-oncall-alerts"

image:
  # Hackathon dev image. Migrated 2026-06-14 from docker.io/shahrelic/
  # hack-2026-nodemedic (sshah's personal Docker Hub repo) to the team
  # cf-registry.nr-ops.net/container-fabric/nodemedic-controller path.
  # Push works with developer cf-registry credentials (docker login
  # cf-registry.nr-ops.net + email-as-username); no CI service-account
  # is required, contrary to an earlier hypothesis.
  repository: cf-registry.nr-ops.net/container-fabric/nodemedic-controller
  # Tag follows the merge commit on hackathon-2026/cf1z-baseline (PR #2
  # merged 2026-06-14). Image was built from this commit on Apple
  # Silicon via Colima after applying the Dockerfile BUILDPLATFORM fix
  # (separate commit on this branch).
  tag: "dev-cf1z-9e029aa9"
