{{- $_ := include "nodemedic-agent.requireTestCluster" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nodemedic-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "nodemedic-agent.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "nodemedic-agent.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
