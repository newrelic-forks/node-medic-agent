name: nodemedic-ci

# Runs only on PRs that touch the NodeMedic controller code paths so it stays
# out of the way of NPD's existing CI. NPD's lint, codeql, scorecards, etc.,
# still run repo-wide via their own workflows.

on:
  pull_request:
    paths:
      - 'cmd/nodemedic-controller/**'
      - 'api/**'
      - 'internal/nodemedic/**'
      - 'config/nodemedic/**'
      - 'deployment/helm/nodemedic-controller/**'
      - 'test/nodemedic/**'
      - 'Dockerfile.nodemedic-controller'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/nodemedic-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: nodemedic-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run nodemedic unit tests
        run: make nodemedic-test

  helm-lint:
    name: nodemedic-helm-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.14.4

      - name: Lint Helm chart
        # The `make nodemedic-helm-lint` target also asserts the cluster-name
        # guard rejects non-`test-` clusters (Constitution Article I.9).
        # If the templates dir is still empty (Phase 1), skip without failing.
        run: |
          if [ -z "$(ls -A deployment/helm/nodemedic-controller/templates 2>/dev/null | grep -v '^\.gitkeep$')" ]; then
            echo "::notice::Helm chart templates not yet authored — skipping (Phase 2 lands them)"
            exit 0
          fi
          make nodemedic-helm-lint
